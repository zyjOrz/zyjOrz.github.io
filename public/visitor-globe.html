<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Visitor locations — MapMyVisitors</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; background: transparent; }
      .visitor-map { width: 240px; max-width: 100%; margin: 0 auto; }
      a { display: block; }
      img { display: block; width: 100%; height: auto; border: 0; }
    </style>
  </head>
  <body>
    <!-- Compatibility page only. The homepage now embeds the image directly
         via app/VisitorGlobe.tsx and does not load this page in an iframe. -->
    <div class="visitor-map">
      <a
        href="https://mapmyvisitors.com/web/1c8f1"
        title="Visit tracker"
        target="_blank"
        rel="noopener noreferrer"
      >
        <img
          src="https://mapmyvisitors.com/map.png?d=lKHf8BqRebBB-StPHh2OO0tGiewbln-oYKxaOgftHfA&amp;cl=ffffff"
          alt="Visitor locations on a world map — open visitor statistics"
          width="240"
          loading="eager"
          decoding="async"
          referrerpolicy="strict-origin-when-cross-origin"
        />
      </a>
    </div>
  </body>
</html>
